experiment: operator_study
extends: baseline.yaml
matrix:
  attention: [eager, sdpa, flash_attention_2]
workload:
  points:
    - {context_length: 128, batch_size: 1, label: low_load}
    - {context_length: 512, batch_size: 8, label: medium_load}
    - {context_length: 2048, batch_size: 1, label: long_context}
    - {context_length: 2048, batch_size: 16, label: high_throughput}
    - {context_length: 4096, batch_size: 4, label: extreme_context}
  output_tokens: 64
  warmups: 2
  repetitions: 10
  seed: 4012
output:
  path: results/raw/operator_study.jsonl
  resume: true

